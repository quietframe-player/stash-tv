<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="same-origin" />
    <title>Stash TV</title>
    <link rel="stylesheet" href="./style.css?v=0.3.0" />
    <script type="module" src="./player.js?v=0.3.0"></script>
  </head>
  <body>
    <main id="player" tabindex="-1" aria-label="Stash TV player" data-phase="loading">
      <video id="video" playsinline preload="metadata"></video>
      <button id="surface" type="button" aria-label="Play video"></button>
      <span id="gesture-feedback" hidden aria-live="polite">2×</span>
      <footer class="chrome">
        <div class="timeline">
          <div id="seek-preview" hidden aria-hidden="true">
            <div id="preview-frame">
              <img id="preview-image" alt="" draggable="false" />
              <canvas id="preview-exact" hidden></canvas>
            </div>
            <span id="preview-time"></span>
            <span id="preview-marker" hidden></span>
          </div>
          <span id="elapsed">0:00</span>
          <input id="seek" type="range" min="0" max="1" value="0" step="0.1" aria-label="Seek" />
          <div id="seek-markers" role="group" aria-label="Scene markers" hidden></div>
          <span id="duration">0:00</span>
        </div>
        <!-- Lucide SVGs, ISC license. See LUCIDE-LICENSE.txt and the README. -->
        <nav aria-label="Playback controls">
          <button id="previous" type="button" aria-label="Previous video" title="Previous video">
            <svg
              class="icon icon-skip-back"
              aria-hidden="true"
              focusable="false"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"
              />
              <path d="M3 20V4" />
            </svg></button
          ><button id="toggle" type="button" aria-label="Play" title="Play" aria-busy="true">
            <svg
              class="icon icon-loader-circle"
              aria-hidden="true"
              focusable="false"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12a9 9 0 1 1-6.219-8.56" />
            </svg>

            <svg
              class="icon icon-play"
              aria-hidden="true"
              focusable="false"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"
              /></svg
            ><svg
              class="icon icon-pause"
              aria-hidden="true"
              focusable="false"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="14" y="3" width="5" height="18" rx="1" />
              <rect x="5" y="3" width="5" height="18" rx="1" /></svg
            ><svg
              class="icon icon-rotate-ccw"
              aria-hidden="true"
              focusable="false"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg></button
          ><button id="next" type="button" aria-label="Next video" title="Next video">
            <svg
              class="icon icon-skip-forward"
              aria-hidden="true"
              focusable="false"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 4v16" />
              <path
                d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"
              />
            </svg></button
          ><button id="random" type="button" aria-label="Random video" title="Random video">
            <svg
              class="icon icon-shuffle"
              aria-hidden="true"
              focusable="false"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m18 14 4 4-4 4" />
              <path d="m18 2 4 4-4 4" />
              <path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22" />
              <path d="M2 6h1.972a4 4 0 0 1 3.6 2.2" />
              <path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45" />
            </svg>
          </button>
          <div class="volume-controls">
            <button id="mute" type="button" aria-label="Volume" title="Volume" aria-expanded="false" aria-controls="volume-panel">
              <svg
                class="icon icon-volume-2"
                aria-hidden="true"
                focusable="false"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"
                />
                <path d="M16 9a5 5 0 0 1 0 6" />
                <path d="M19.364 18.364a9 9 0 0 0 0-12.728" />
              </svg>
              <svg
                class="icon icon-volume-x"
                aria-hidden="true"
                focusable="false"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M11 4.702a.7.7 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.7.7 0 0 0 11 19.298z"
                />
                <path d="m16.5 14.5 5-5" />
                <path d="m16.5 9.5 5 5" />
              </svg>
            </button>
            <div id="volume-panel" hidden role="group" aria-label="Volume controls">
            <input
              id="volume"
              type="range"
              min="0"
              max="100"
              value="100"
              step="5"
              aria-label="Volume"
              aria-valuetext="100%"
            />
              <button id="volume-mute" type="button" aria-label="Mute" title="Mute">              <svg
                class="icon icon-volume-x"
                aria-hidden="true"
                focusable="false"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M11 4.702a.7.7 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.7.7 0 0 0 11 19.298z"
                />
                <path d="m16.5 14.5 5-5" />
                <path d="m16.5 9.5 5 5" />
              </svg></button>
            </div>
          </div>
          <label id="quality-controls" class="source-label" hidden
            >Quality
            <select id="source" aria-label="Stream quality"></select></label
          ><button
            id="delete"
            type="button"
            aria-label="Permanently delete video"
            title="Permanently delete video and files"
            hidden
            disabled
          >
            <svg
              class="icon icon-trash"
              aria-hidden="true"
              focusable="false"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M10 11v6" />
              <path d="M14 11v6" />
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
              <path d="M3 6h18" />
              <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            </svg></button
          ><button id="fullscreen" type="button" aria-label="Fullscreen" title="Fullscreen">
            <svg
              class="icon icon-maximize"
              aria-hidden="true"
              focusable="false"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M8 3H5a2 2 0 0 0-2 2v3" />
              <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
              <path d="M3 16v3a2 2 0 0 0 2 2h3" />
              <path d="M16 21h3a2 2 0 0 0 2-2v-3" /></svg
            ><svg
              class="icon icon-minimize"
              aria-hidden="true"
              focusable="false"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M8 3v3a2 2 0 0 1-2 2H3" />
              <path d="M21 8h-3a2 2 0 0 1-2-2V3" />
              <path d="M3 16h3a2 2 0 0 1 2 2v3" />
              <path d="M16 21v-3a2 2 0 0 1 2-2h3" />
            </svg>
          </button>
        </nav>
        <p id="status" class="message" role="status" hidden></p>
        <p id="notice" class="message" role="status"></p>
      </footer>
    </main>
  </body>
</html>
